name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component rust-docs
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check embedded notices
        run: python scripts/third_party_notices.py --check
      - name: Run tests
        run: cargo test --locked --workspace --target x86_64-pc-windows-msvc
      - name: Build Windows release executable
        run: cargo build --locked --release --bin WRKLMNL --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v7
        with:
          path: target/x86_64-pc-windows-msvc/release/WRKLMNL.exe
          archive: false
          if-no-files-found: error
